spring:
  application:
    name: ms-scoring
  
    data:
      mongodb:
        uri: ${MONGODB_URI:mongodb://localhost:27017/world_dance_scoring}
        auto-index-creation: true
server:
  port: 9093
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.data.mongodb.core: DEBUG
    org.springframework.boot.actuate: DEBUG

security:
    jwt:
      secret: ${JWT_SECRET:F0bVQgRnuk6DRxooVWKaG0ndlgqEeI/4YXObXeOaR2Q=}