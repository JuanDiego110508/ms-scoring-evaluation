spring:
  application:
    name: ms-scoring
  
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        health-check-path: /actuator/health
        prefer-ip-address: false
        instance-id: ${spring.application.name}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/world_dance_scoring}
      auto-index-creation: true

logging: # Seccion de logs
  level: # Niveles por paquete / clase
    org.springframework.web: DEBUG # Logs detallados para web (request HTTP)
    org.springframework.data.mongodb.core: DEBUG # Logs detallados para MongoDB (consultas)
server:
  port: 9093
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret-key: ${jwt_secret}
    token-expiration: 900000

jwt:
  secret: ${JWT_SECRET}